<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Do. — Todo List</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ========== SIDEBAR ========== -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1 class="app-title">Do.</h1>
      <p class="app-sub">stay sharp.</p>
    </div>

    <div class="sidebar-section">
      <span class="sidebar-label">Projects</span>
      <!-- JS: render <ul id="project-list"> here -->
      <ul id="project-list">
        <!-- each item: <li class="project-item active" data-id="...">
               <span class="project-dot"></span>
               <span class="project-name">Inbox</span>
               <span class="project-count">3</span>
             </li> -->
      </ul>
    </div>

    <button class="btn-add-project" id="btn-add-project">
      <span class="plus">+</span> New Project
    </button>
  </aside>

  <!-- ========== MAIN ========== -->
  <main class="main">

    <!-- Main header -->
    <div class="main-header">
      <!-- JS: update h2 text to current project name -->
      <h2 class="project-title" id="project-title">Inbox</h2>
      <button class="btn-add-todo" id="btn-add-todo">+ Add Todo</button>
    </div>

    <!-- Todo list -->
    <!-- JS: render todo cards here -->
    <ul id="todo-list">
      <!-- each item:
        <li class="todo-card priority-low|medium|high" data-id="...">
          <input type="checkbox" class="todo-check">
          <div class="todo-info">
            <span class="todo-title">Buy groceries</span>
            <span class="todo-due">Jun 12</span>
          </div>
          <div class="todo-actions">
            <button class="btn-expand" data-id="...">↗</button>
            <button class="btn-delete" data-id="...">✕</button>
          </div>
        </li>
      -->
    </ul>

    <!-- Empty state (show when no todos) -->
    <div class="empty-state" id="empty-state">
      <p class="empty-text">Nothing here yet.</p>
      <p class="empty-sub">Add a todo to get started.</p>
    </div>

  </main>

  <!-- ========== MODAL: ADD / EDIT TODO ========== -->
  <!-- JS: toggle class .open to show/hide -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal-todo">

      <div class="modal-header">
        <!-- JS: change text between "New Todo" and "Edit Todo" -->
        <h3 class="modal-title" id="modal-title">New Todo</h3>
        <button class="btn-close" id="btn-close-modal">✕</button>
      </div>

      <div class="modal-body">

        <div class="field">
          <label for="input-title">Title</label>
          <input type="text" id="input-title" placeholder="What needs to be done?" />
        </div>

        <div class="field">
          <label for="input-desc">Description</label>
          <textarea id="input-desc" rows="3" placeholder="Add some details..."></textarea>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="input-due">Due Date</label>
            <input type="date" id="input-due" />
          </div>

          <div class="field">
            <label for="input-priority">Priority</label>
            <select id="input-priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="input-notes">Notes</label>
          <textarea id="input-notes" rows="2" placeholder="Any extra notes..."></textarea>
        </div>

        <div class="field">
          <label for="input-project">Project</label>
          <!-- JS: populate options from project list -->
          <select id="input-project"></select>
        </div>

      </div>

      <div class="modal-footer">
        <button class="btn-cancel" id="btn-cancel">Cancel</button>
        <!-- JS: change text between "Add Todo" and "Save Changes" -->
        <button class="btn-submit" id="btn-submit">Add Todo</button>
      </div>

    </div>
  </div>

  <!-- ========== MODAL: ADD PROJECT ========== -->
  <div class="modal-overlay" id="modal-project-overlay">
    <div class="modal modal-sm" id="modal-project">

      <div class="modal-header">
        <h3 class="modal-title">New Project</h3>
        <button class="btn-close" id="btn-close-project">✕</button>
      </div>

      <div class="modal-body">
        <div class="field">
          <label for="input-project-name">Project Name</label>
          <input type="text" id="input-project-name" placeholder="e.g. Work, Personal..." />
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn-cancel" id="btn-cancel-project">Cancel</button>
        <button class="btn-submit" id="btn-submit-project">Create</button>
      </div>

    </div>
  </div>

  <script src="index.js" type="module"></script>
</body>
</html>
